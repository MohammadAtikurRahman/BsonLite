name: Experimental MongoDB 9 encrypted engine
on:
  workflow_dispatch:
  push:
    branches: [upgrade/mongodb-9.0]
  pull_request:
    paths: ['native/modern/**', 'src/**', 'scripts/**', 'test/modern*', '.github/workflows/modern-engine.yml']
permissions:
  contents: read
concurrency:
  group: modern-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci
      - run: npm test
      - run: npm run build:modern:preview
      - run: node native/modern/console-compat/verify.cjs
      - run: npm ci --ignore-scripts
        working-directory: native/modern/console-compat
      - run: npm run test:modern
        env:
          BSONLITE_CONSOLE_REPO: ${{ github.workspace }}/native/modern/console-compat
  storage:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - run: python native/modern/prepare.py
      - name: Build the pinned crypto library
        run: |
          cd native/build/modern/dependencies/libsodium-1.0.22
          ./configure --disable-shared --enable-static --with-pic --prefix="$GITHUB_WORKSPACE/native/build/modern/sodium"
          make -j4
          make install
      - name: Test the real WiredTiger 12 ABI, encrypted data/journals and wrong keys
        run: |
          python native/modern/patch_mongo.py native/build/modern/dependencies/mongo-246de92935f8636f4f90889d418b31ae70dbaafd --sodium-include native/build/modern/sodium/include --sodium-library native/build/modern/sodium/lib/libsodium.a
          python native/modern/test_wiredtiger.py --mongo native/build/modern/dependencies/mongo-246de92935f8636f4f90889d418b31ae70dbaafd --sodium-root native/build/modern/sodium --work native/build/modern/wt12-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wiredtiger12-storage-evidence-${{ github.sha }}
          path: native/build/modern/wt12-probe/validation.json
  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: engine-cache
        with:
          path: |
            assets/modern-win32-x64/
            native/build/modern/BsonLite-modern-engine-source.tar.gz
            licenses/modern/
          key: modern-native-v143-static-v1-${{ hashFiles('native/modern/deps.lock.json', 'native/modern/patch_mongo.py', 'native/modern/hooks.inc', 'native/modern/build_windows.ps1', 'native/modern/enable_utf8.py', 'native/modern/package_source.py', 'native/src/**', 'scripts/enable_windows_utf8.py') }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: native-cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: native/build/modern/bazel-cache
          key: modern-win2022-v143-static-v1-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: modern-win2022-v143-static-v1-
      - name: Build the pinned SSPL source and encrypted engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        shell: pwsh
        run: ./native/modern/build_windows.ps1
      - name: Preserve the compiled engine before runtime and packaging tests
        if: steps.engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            assets/modern-win32-x64/
            native/build/modern/BsonLite-modern-engine-source.tar.gz
            licenses/modern/
          key: modern-native-v143-static-v1-${{ hashFiles('native/modern/deps.lock.json', 'native/modern/patch_mongo.py', 'native/modern/hooks.inc', 'native/modern/build_windows.ps1', 'native/modern/enable_utf8.py', 'native/modern/package_source.py', 'native/src/**', 'scripts/enable_windows_utf8.py') }}
      - run: npm ci
      - run: npm run build:modern:preview
      - run: node native/modern/console-compat/verify.cjs
      - run: npm ci --ignore-scripts
        working-directory: native/modern/console-compat
      - run: python native/modern/prepare_legacy.py --work native/build/modern/legacy-sdk
      - name: Full native storage, journal, spill, key and backup suites
        shell: pwsh
        run: |
          $env:BSONLITE_TEST_MODULE = Join-Path $PWD 'dist-modern/BsonLite.cjs'
          $env:BSONLITE_NATIVE_BINARY = Join-Path $PWD 'assets/modern-win32-x64/mongod.exe'
          $env:BSONLITE_NATIVE_MANIFEST = Join-Path $PWD 'assets/modern-win32-x64/native-engine.json'
          node --test --test-concurrency=1 --test-reporter=junit --test-reporter-destination=native/build/modern/source-native.xml test/native-integration.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real encrypted storage, TLS, BSON and restart
        shell: pwsh
        run: |
          $env:BSONLITE_MODERN_BINARY = Join-Path $PWD 'assets/modern-win32-x64/mongod.exe'
          $env:BSONLITE_MODERN_MANIFEST = Join-Path $PWD 'assets/modern-win32-x64/native-engine.json'
          $env:BSONLITE_CONSOLE_REPO = Join-Path $PWD 'native/modern/console-compat'
          $env:BSONLITE_LEGACY_MODULE = Join-Path $PWD 'native/build/modern/legacy-sdk/package'
          node --test --test-concurrency=1 --test-reporter=junit --test-reporter-destination=native/build/modern/runtime.xml test/modern-integration.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify required test cases before permitting an embedded bundle
        run: python native/modern/validate_release.py --phase source --source native/build/modern/source-native.xml --runtime native/build/modern/runtime.xml
      - name: Build the experimental single-file SDK with matching source
        shell: pwsh
        run: |
          $env:BSONLITE_ENGINE_PATH = Join-Path $PWD 'assets/modern-win32-x64/mongod.exe'
          $env:BSONLITE_NATIVE_MANIFEST = Join-Path $PWD 'assets/modern-win32-x64/native-engine.json'
          npm run build:modern
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the actual embedded SDK and isolated concurrent consumers
        shell: pwsh
        run: |
          $env:BSONLITE_TEST_MODULE = Join-Path $PWD 'dist-modern/BsonLite.cjs'
          $env:BSONLITE_NATIVE_BINARY = Join-Path $PWD 'assets/modern-win32-x64/mongod.exe'
          $env:BSONLITE_NATIVE_MANIFEST = Join-Path $PWD 'assets/modern-win32-x64/native-engine.json'
          $env:BSONLITE_MODERN_EMBEDDED = '1'
          node --test --test-concurrency=1 --test-reporter=junit --test-reporter-destination=native/build/modern/final-native.xml test/native-integration.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/modern/validate_release.py --phase final --source native/build/modern/source-native.xml --runtime native/build/modern/runtime.xml --final native/build/modern/final-native.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MohammadAtikurRahman/Bsonlite-SDK
          ref: 7f33825972537deecb3ba79ed36fa95a0c86ea16
          path: native/build/npm-packager
          persist-credentials: false
      - name: Prepare, verify and install the actual experimental npm package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'bsonlite-modern-npm'
          $packed = Join-Path $PWD 'native/build/modern/npm'
          $consumer = Join-Path $env:RUNNER_TEMP 'bsonlite-modern-npm-consumer'
          node native/build/npm-packager/scripts/prepare-modern.cjs --artifact $PWD --out $package --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $packed | Out-Null
          Push-Location $package
          try {
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm pack --pack-destination $packed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $tarball = Join-Path $packed 'bsonlite-sdk-0.7.0-alpha.0.tgz'
          npm install --prefix $consumer --ignore-scripts --no-audit --no-fund $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $consumer 'node_modules/bsonlite-sdk/scripts/verify-modern.cjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $package 'validation.json') $packed
          Copy-Item (Join-Path $package 'MODERN_VALIDATION.md') $packed
          ((Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + (Split-Path $tarball -Leaf)) | Set-Content (Join-Path $packed 'SHA256SUMS.txt') -Encoding utf8NoBOM
      - name: Upload the prepared npm prerelease without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BsonLite-modern-npm-${{ github.sha }}
          if-no-files-found: error
          path: native/build/modern/npm/
      - name: Upload experimental evidence and matching source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BsonLite-modern-experimental-${{ github.sha }}
          if-no-files-found: error
          path: |
            assets/modern-win32-x64/
            native/build/modern/BsonLite-modern-engine-source.tar.gz
            licenses/modern/
            dist-modern/
            licenses/modern-sdk/
            native/build/modern/*.xml
      - name: Preserve failed-run test reports and the native manifest
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BsonLite-modern-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            native/build/modern/*.xml
            assets/modern-win32-x64/native-engine.json
      - name: Preserve successful compiler actions for the next build attempt
        if: always() && steps.engine-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: native/build/modern/bazel-cache
          key: modern-win2022-v143-static-v1-${{ github.sha }}-${{ github.run_attempt }}
# No npm publishing or automatic public release. Native validation flags require
# named, unskipped source, migration, spill and final bundled-consumer tests.
